mcs.metadata:
  componentName: Greeting
  description: Responds when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi
  actions:
    - kind: SendActivity
      id: sendMessage_greeting
      activity: What process condition did you observe?

